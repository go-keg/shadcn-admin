"""
Directs the executor to defer this fragment when the `if` argument is true or undefined.
"""
directive @defer(
    """Deferred when true or undefined."""
    if: Boolean = true
    """Unique name"""
    label: String
) on FRAGMENT_SPREAD | INLINE_FRAGMENT

directive @disabled on FIELD_DEFINITION | OBJECT

directive @goField(forceResolver: Boolean, name: String, omittable: Boolean) on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

directive @goModel(forceGenerate: Boolean, model: String, models: [String!]) on ENUM | INPUT_OBJECT | INTERFACE | OBJECT | SCALAR | UNION

"""拥有指定职能角色"""
directive @hasJobRole(role: [AccountJobRoleJobRole!]) on FIELD_DEFINITION | OBJECT

"""拥有指定权限"""
directive @hasPermission(key: String!) on FIELD_DEFINITION | OBJECT

directive @hasRole(role: [Role!]) on FIELD_DEFINITION | OBJECT

"""拥有任意权限"""
directive @hasSomePermissions(keys: [String!]) on FIELD_DEFINITION | OBJECT

"""是否在部门中"""
directive @inDepartment(code: [Department!]) on FIELD_DEFINITION | OBJECT

"""是否为某些职位"""
directive @inPosition(code: [Position!]) on FIELD_DEFINITION | OBJECT

"""是商家身份"""
directive @isMerchant on FIELD_DEFINITION | OBJECT

